<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive Mockup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #efefef;
      font-family: Arial, sans-serif;
    }

    .topbar {
      height: 30px;
      background: #ededed;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 2;
    }
 
    .gamebar {
      width: 100%;
      height: 370px;
      background: #000;
    }

    @media (max-width: 600px) {
      .gamebar {
        height: 226px;
      }
    }

    .bottom-overlay {
      position: absolute;
      top: 340px;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (max-width: 600px) {
      .bottom-overlay {
        top: 196px;
      }
    }

    .bottom-overlay p {
      color: #bfbebf;
      font-size: 22px;
      margin: 0;
    }

    .logo-homebrew {
      width: auto;
      height: 30px;
      margin-left: 130px;
      margin-top: 2px;
      object-fit: contain;
    }

    .content {
      min-height: calc(100vh - 74px);
      background: #efefef;
    }

    .latest-game {
      width: auto;
      height: 370px;
      margin: 0 auto;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 600px) {
      .latest-game {
        height: 100%;
      }
    }

  </style>
</head>
<body>
  <div class="topbar">
    <img class="logo-homebrew" src="images/logo-homebrew.png" alt="Nintendo">
  </div>

  <div class="gamebar">
    <img class="latest-game" src="images/latest-game.png">
    <div class="bottom-overlay"></div>
  </div>

  <div class="bottom-overlay">
    <p>Available now</p>
  </div>

  <div class="content"></div>
</body>
</html>
